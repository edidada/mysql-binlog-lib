name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.lang }} — build / test / golden
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [c, cpp, rust, go, java, csharp, zig, erlang, python, asm]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        if: matrix.lang == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Zig
        if: matrix.lang == 'zig'
        uses: mlugg/setup-zig@v1
        with:
          version: '0.13.0'

      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Erlang/OTP
        if: matrix.lang == 'erlang'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq erlang

      - name: Setup NASM
        if: matrix.lang == 'asm'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm

      - name: Toolchain versions
        run: |
          echo "lang=${{ matrix.lang }}"
          cmake --version | head -1
          gcc --version | head -1
          python3 --version
          case "${{ matrix.lang }}" in
            go) go version ;;
            rust) rustc --version; cargo --version ;;
            java) javac -version ;;
            csharp) dotnet --version ;;
            zig) zig version ;;
            erlang) command -v erlc; command -v escript ;;
            asm) nasm -v ;;
          esac

      - name: Generate & verify fixtures (no drift)
        run: |
          set -e
          python3 fixtures/gen_fixture.py
          git diff --exit-code -- fixtures/demo.bin fixtures/expected.jsonl

      - name: Build, unit test, run (C)
        if: matrix.lang == 'c'
        run: |
          set -e
          cmake -S c -B c/build -DCMAKE_BUILD_TYPE=Release
          cmake --build c/build --parallel
          ctest --test-dir c/build --output-on-failure
          ./c/build/mysqlbinlog-c --file fixtures/demo.bin --format jsonl > out.jsonl

      - name: Build, unit test, run (C++)
        if: matrix.lang == 'cpp'
        run: |
          set -e
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --parallel
          ctest --test-dir cpp/build --output-on-failure
          ./cpp/build/mysqlbinlog-cpp --file fixtures/demo.bin --format jsonl > out.jsonl

      - name: Build, unit test, run (Rust)
        if: matrix.lang == 'rust'
        run: |
          set -e
          cargo build --release --manifest-path rust/Cargo.toml
          cargo test --manifest-path rust/Cargo.toml
          ./rust/target/release/mysqlbinlog-rust --file fixtures/demo.bin --format jsonl > out.jsonl

      - name: Build, unit test, run (Go)
        if: matrix.lang == 'go'
        run: |
          set -e
          cd go
          go build -o ../mysqlbinlog-go ./cmd/mysqlbinlog
          go test ./...
          cd ..
          ./mysqlbinlog-go --file fixtures/demo.bin --format jsonl > out.jsonl

      - name: Build, unit test, run (Java)
        if: matrix.lang == 'java'
        run: |
          set -e
          mkdir -p java/out
          javac -d java/out $(find java/src java/test -name '*.java')
          java -cp java/out mysqlbinlog.ParserTest
          java -cp java/out mysqlbinlog.Cli --file fixtures/demo.bin --format jsonl > out.jsonl

      - name: Build, unit test, run (C#)
        if: matrix.lang == 'csharp'
        run: |
          set -e
          dotnet build csharp/src/MysqlBinlog.csproj -c Release -o csharp/out
          dotnet build csharp/tests/MysqlBinlog.Tests.csproj -c Release -o csharp/testout
          dotnet csharp/testout/MysqlBinlog.Tests.dll
          dotnet csharp/out/mysqlbinlog-cs.dll --file fixtures/demo.bin --format jsonl > out.jsonl

      - name: Build, unit test, run (Zig)
        if: matrix.lang == 'zig'
        run: |
          set -e
          cd zig
          zig build -Doptimize=ReleaseSafe
          zig build test -Doptimize=ReleaseSafe
          cd ..
          ./zig/zig-out/bin/mysqlbinlog-zig --file fixtures/demo.bin --format jsonl > out.jsonl

      - name: Build, unit test, run (Erlang)
        if: matrix.lang == 'erlang'
        run: |
          set -e
          mkdir -p erlang/ebin
          erlc -o erlang/ebin erlang/src/*.erl erlang/test/*.erl
          erl -noshell -pa erlang/ebin -eval 'case eunit:test(mysqlbinlog_tests,[verbose]) of ok -> halt(0); _ -> halt(1) end.'
          escript erlang/mysqlbinlog-erl --file fixtures/demo.bin --format jsonl > out.jsonl

      - name: Build, unit test, run (Python)
        if: matrix.lang == 'python'
        run: |
          set -e
          python3 -m py_compile python/mysqlbinlog.py python/mysqlbinlog_cli.py python/test_parser.py
          python3 -m unittest discover -s python -p 'test_*.py' -v
          python3 python/mysqlbinlog_cli.py --file fixtures/demo.bin --format jsonl > out.jsonl

      - name: Build, unit test, run (x86-64 asm)
        if: matrix.lang == 'asm'
        run: |
          set -e
          nasm -felf64 asm/main.asm -o asm/main.o
          gcc -no-pie -o asm/mysqlbinlog-asm asm/main.o
          ./asm/mysqlbinlog-asm --self-test
          ./asm/mysqlbinlog-asm --file fixtures/demo.bin --format jsonl > out.jsonl

      - name: Golden diff (must match expected.jsonl byte-for-byte)
        run: |
          set -e
          test -s out.jsonl
          diff -u fixtures/expected.jsonl out.jsonl
          echo "OK: ${{ matrix.lang }} build + unit tests + golden output all passed"
